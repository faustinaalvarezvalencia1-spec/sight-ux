<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div><div style="height:8px;background:var(--state-positive)"></div><div style="margin-top:10px;font-weight:600;font-size:13px;color:var(--text-strong)">Vigente</div><div class="mono">--state-positive</div></div><div><div style="height:8px;background:var(--state-attention)"></div><div style="margin-top:10px;font-weight:600;font-size:13px;color:var(--text-strong)">En observación</div><div class="mono">--state-attention</div></div><div><div style="height:8px;background:var(--state-critical)"></div><div style="margin-top:10px;font-weight:600;font-size:13px;color:var(--text-strong)">Riesgo</div><div class="mono">--state-critical</div></div><div><div style="height:8px;background:var(--state-neutral)"></div><div style="margin-top:10px;font-weight:600;font-size:13px;color:var(--text-strong)">Sin dato</div><div class="mono">--state-neutral</div></div>
</div></div></body></html>
