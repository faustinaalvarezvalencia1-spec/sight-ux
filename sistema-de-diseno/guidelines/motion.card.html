<!-- @dsCard group="Spacing" viewport="700x170" name="Movimiento" subtitle="Curva única, sin rebotes; 120 / 200 / 360 ms" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body);letter-spacing:var(--tracking);-webkit-font-smoothing:antialiased}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--pink-600)}.w{padding:20px}.mono{font:var(--fw-regular) 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;color:var(--text-muted)}</style></head><body><div class="w"><div style="display:grid;gap:12;font:300 15px/1.5 var(--font-sans);letter-spacing:var(--tracking);color:var(--text-strong)">
<div><span class="mono" style="display:inline-block;width:210px">--ease-standard</span>cubic-bezier(0.2, 0, 0, 1) — entradas y hover</div>
<div><span class="mono" style="display:inline-block;width:210px">--ease-exit</span>cubic-bezier(0.4, 0, 1, 1) — salidas</div>
<div><span class="mono" style="display:inline-block;width:210px">--dur-fast / base / slow</span>120 / 200 / 360 ms</div>
<div style="color:var(--text-muted)">Sin rebotes, sin escalados elásticos, sin parallax. El movimiento confirma una acción; no la celebra.</div>
</div></div></body></html>
