<!-- @dsCard group="Brand" viewport="900x460" name="Versiones del logotipo" subtitle="sight lab institucional / sight cotidiano" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body);letter-spacing:var(--tracking)}a{color:var(--text-accent)}a:hover{color:var(--pink-600)}#root{padding:40px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">const {Wordmark}=window.SightDesignSystem_3d4cc7;
const Eyebrow=({children})=><div style={{font:'var(--type-eyebrow)',letterSpacing:'var(--tracking-caps)',textTransform:'uppercase',color:'var(--text-muted)'}}>{children}</div>;
function Col({title,children,body}){return <div style={{display:'grid',gap:16,alignContent:'start'}}>
  <div style={{background:'var(--coconut-milk)',minHeight:170,display:'grid',placeItems:'center',padding:24}}>{children}</div>
  <div><Eyebrow>{title}</Eyebrow><p style={{margin:'8px 0 0',font:'var(--fw-light) 17px/1.4 var(--font-sans)',letterSpacing:'var(--tracking)',maxWidth:'44ch'}}>{body}</p></div>
</div>;}
function Demo(){return <div style={{display:'grid',gap:28}}>
<h2 style={{font:'var(--fw-extrabold) 32px/1.1 var(--font-sans)',letterSpacing:'var(--tracking)',color:'var(--text-strong)',margin:0}}>Versiones del logotipo</h2>
<div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:40}}>
  <Col title="sight lab — institucional" body="Escenarios formales y estratégicos: presentaciones iniciales, propuestas, documentos corporativos. LAB refuerza la idea de laboratorio y experimentación estratégica."><Wordmark lockup="sight lab" size={64}/></Col>
  <Col title="sight — simplificada" body="Comunicaciones cotidianas, aplicaciones digitales y piezas gráficas. Sin LAB gana ligereza y versatilidad, y conserva el elemento distintivo del ojo."><Wordmark lockup="sight" size={64}/></Col>
</div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
