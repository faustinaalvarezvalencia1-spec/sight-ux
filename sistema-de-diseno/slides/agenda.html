<!-- @dsCard group="Slides" viewport="1280x720" name="Índice" subtitle="Lista numerada con regla de acento" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:var(--font-sans);letter-spacing:var(--tracking)}a{color:var(--pink-paradise)}a:hover{color:var(--pink-600)}.slide{width:1280px;height:720px;padding:80px;box-sizing:border-box;display:flex;flex-direction:column}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">const {Divider,Wordmark}=window.SightDesignSystem_3d4cc7;
const items=['Punto de partida','Diagnóstico','Causa raíz','Tratamiento propuesto','Medición y siguientes pasos'];
function Slide(){return <div className="slide" style={{background:'var(--paper)',color:'var(--text-strong)',justifyContent:'space-between'}}>
<div><div style={{font:'var(--fw-semibold) 12px/1 var(--font-sans)',letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--pink-paradise)',marginBottom:16}}>Contenido</div>
<h2 style={{margin:'0 0 40px',font:'var(--fw-extrabold) 54px/1.1 var(--font-sans)',letterSpacing:'var(--tracking)'}}>Qué vamos a revisar</h2>
<Divider tone="accent"/>
<ol style={{listStyle:'none',margin:0,padding:0}}>{items.map((t,i)=><li key={t} style={{display:'flex',gap:28,alignItems:'baseline',padding:'22px 0',borderBottom:'1px solid var(--border-hairline)'}}>
<span style={{font:'var(--fw-semibold) 16px/1 var(--font-sans)',color:'var(--pink-paradise)',width:32}}>0{i+1}</span>
<span style={{font:'var(--fw-light) 36px/1.15 var(--font-sans)',letterSpacing:'var(--tracking)'}}>{t}</span></li>)}</ol></div>
<Wordmark lockup="sight" size={20} color="var(--text-muted)"/>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide/>);
</script></body></html>
