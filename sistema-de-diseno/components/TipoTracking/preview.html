<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tracking</title><style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body);letter-spacing:var(--tracking);-webkit-font-smoothing:antialiased}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--pink-600)}.w{padding:20px}.mono{font:var(--fw-regular) 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;color:var(--text-muted)}</style></head>
<body><div class="w"><div style="display:grid;gap:16">
<div><div class="mono">letter-spacing: 0 — incorrecto</div><div style="font-size:30px;font-weight:600;letter-spacing:0;color:var(--text-muted)">Traducimos incertidumbre</div></div>
<div><div class="mono">var(--tracking) = -0.04em — correcto</div><div style="font-size:30px;font-weight:600;letter-spacing:-0.04em;color:var(--text-strong)">Traducimos incertidumbre</div></div>
</div></div></body></html>
